<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18130F">
<title>Blomster til Torgeir</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /* ---------- Låst palett (fra kortet og logoen) ---------- */
  :root{
    --bg:#18130F; --bg2:#26201A;
    --kraft:#A97C52; --kraft-d:#7A5537; --kraft-l:#C49B6E;
    --cream:#EAD3A8; --paper:#F1E6D0;
    --stem:#A88B62; --leaf:#6E5A3C;
    --orange:#DE6A2A; --coral:#E9785A; --mustard:#E3A63B; --red:#A2301F;
    --accent:#49B2CF; /* den ene kalde aksenten: petrol */
    --lw:2.2px;       /* låst linjetykkelse */
    --cam:1;          /* kamerazoom kompenseres, så linjen holder seg lik */
    color-scheme:dark;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#18130F; } }
  :root[data-theme="dark"]{ --bg:#18130F; }

  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);}
  body{
    background:var(--bg);             /* gradienten ligger i SVG-en, så film og kode er like */
    color:var(--cream);
    font-family:"Bebas Neue","Oswald","Arial Narrow",sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;touch-action:none;
  }
  #stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  .ln,.lw{stroke-width:calc(var(--lw) / var(--cam));stroke-linecap:round;stroke-linejoin:round;}
  .ln{fill:none;}
  .tap{cursor:pointer;}

  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:0 16px;text-align:center;}
  #swoosh{position:absolute;inset:0;width:100%;height:100%;z-index:-1;}
  .eyebrow{margin:0;font-size:17px;letter-spacing:.32em;color:var(--kraft-l);padding-left:.32em;}
  .small{margin:0;font-size:14px;letter-spacing:.28em;color:var(--kraft-l);opacity:.7;padding-left:.28em;}
  #openBtn{
    font:inherit;font-size:30px;letter-spacing:.3em;line-height:1;
    padding:16px 30px 13px calc(30px + .3em);
    color:var(--cream);background:transparent;border:var(--lw) solid var(--cream);border-radius:999px;
    cursor:pointer;transition:background .3s,color .3s;
  }
  #openBtn:hover,#openBtn:focus-visible{background:var(--cream);color:var(--bg);outline:none;}
  #openBtn[aria-busy="true"]{opacity:.6;}
  /* Trykkfølelse: slitasje (blekkmangel, sprekker, slitte kanter) + levende filmkorn */
  #wear,#grain{position:fixed;inset:0;pointer-events:none;z-index:5;}
  #wear{background:url(../assets/wear.png) center/cover no-repeat;opacity:.55;}
  #grain{inset:-128px;background:url(../assets/grain.png) 0 0/128px 128px repeat;opacity:.42;animation:grain .9s steps(6) infinite;}
  @keyframes grain{
    0%{transform:translate(0,0)} 17%{transform:translate(-37px,21px)} 33%{transform:translate(18px,-44px)}
    50%{transform:translate(-61px,-12px)} 67%{transform:translate(42px,33px)} 83%{transform:translate(-9px,57px)} 100%{transform:translate(0,0)}
  }
  @media (prefers-reduced-motion: reduce){ #grain{animation:none;} }
  #fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;}
  /* Del 2 som film på mobil – plasseres så filmens viewBox treffer #stage nøyaktig */
  #growthVideo{position:fixed;left:0;top:0;z-index:3;pointer-events:none;object-fit:fill;background:var(--bg);opacity:0;visibility:hidden;}
  #replayBtn{
    position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);z-index:6;
    font:inherit;font-size:17px;letter-spacing:.28em;line-height:1;padding:11px 20px 9px calc(20px + .28em);
    color:var(--cream);background:rgba(42,30,22,.55);border:var(--lw) solid var(--cream);border-radius:999px;cursor:pointer;
    opacity:0;visibility:hidden;
  }
  #replayBtn:hover,#replayBtn:focus-visible{background:var(--cream);color:var(--bg);outline:none;}
  .hint{
    position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 22px);margin:0;
    text-align:center;font-size:16px;letter-spacing:.26em;color:var(--cream);opacity:0;visibility:hidden;pointer-events:none;
  }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/DrawSVGPlugin.min.js"></script>
<script>
(() => {
'use strict';
gsap.registerPlugin(DrawSVGPlugin);

/* ---------- Låste uttrykksregler ---------- */
const EASE = 'power3.inOut', EASE_OUT = 'power3.out', EASE_IN = 'power3.in', LOOP = 'sine.inOut';
gsap.defaults({ ease: EASE });
const C = {
  bg:'#18130F', kraft:'#A97C52', kraftD:'#7A5537', kraftL:'#C49B6E', cream:'#EAD3A8', paper:'#F1E6D0',
  stem:'#A88B62', leaf:'#6E5A3C', orange:'#EE9330', coral:'#E5579A', mustard:'#EFCB3C', red:'#E2483B',
  redD:'#7A2230', accent:'#49B2CF',
  pink:'#E5579A', purple:'#7E5BAE', blue:'#3F6CB4', cyan:'#49B2CF', green:'#5BAE6B', yellow:'#EFCB3C'
};
// Regnbuen fra VHS-coveret, ytterst til innerst
const RAINBOW = [C.pink, C.purple, C.blue, C.cyan, C.green, C.yellow, C.orange, C.red];
const RAINBOW_REV = RAINBOW.slice().reverse();
const AUDIO = { intro:'../music/peace_song_intro.mp3', outro:'../music/Peace_song_outro.mp3' };
const OUTRO_FALLBACK = 39.95;

const params = new URLSearchParams(location.search);
const MODE = params.get('scene');            // utvikling: card | vase | pour | still
const speed = parseFloat(params.get('speed')) || 1;
const DEBUG = params.has('debug');
gsap.globalTimeline.timeScale(speed);

const $ = s => document.querySelector(s);
const NS = 'http://www.w3.org/2000/svg';
const svg = $('#stage'), hint = $('#hint');
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
const f1 = n => Math.round(n * 10) / 10;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- Lyd: sømløs loop, crossfade, utfade ---------- */
const Sound = (() => {
  const AC = window.AudioContext || window.webkitAudioContext;
  let ctx = null, loading = Promise.resolve();
  const buf = {}, FADE_IN = 3, XFADE = 2.5, FADE_OUT = 4;
  let intro = null, outro = null;

  function init(){
    if (!AC) return;
    try { ctx = new AC(); } catch (e) { ctx = null; return; }
    // Innebygd lyd (data:) dekodes direkte, så den ikke er avhengig av fetch – ellers hentes fila
    const bytes = url => url.startsWith('data:')
      ? Promise.resolve().then(() => { const s = atob(url.slice(url.indexOf(',') + 1)), a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a.buffer; })
      : fetch(url).then(r => { if (!r.ok) throw new Error(url); return r.arrayBuffer(); });
    const load = (k, url) => bytes(url)
      .then(ab => new Promise((res, rej) => ctx.decodeAudioData(ab, res, rej))).then(b => { buf[k] = b; });
    loading = Promise.all([load('intro', AUDIO.intro), load('outro', AUDIO.outro)]).catch(e => console.warn('Lyd:', e));
  }
  // Finn første/siste hørbare sample (MP3-polstring), maks 0,25 s inn fra hver kant
  function edges(b){
    const ch = []; for (let i = 0; i < b.numberOfChannels; i++) ch.push(b.getChannelData(i));
    const lim = Math.floor(b.sampleRate * 0.25), th = 0.0008;
    const loud = i => ch.some(c => Math.abs(c[i]) > th);
    let s = 0; while (s < lim && !loud(s)) s++; if (s >= lim) s = 0;
    let e = b.length - 1, stop = b.length - lim; while (e > stop && !loud(e)) e--; if (e <= stop) e = b.length - 1;
    return { start: s / b.sampleRate, end: (e + 1) / b.sampleRate };
  }
  function unlock(){ // må kalles synkront i klikket
    if (!ctx) return;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    ctx.resume();
    const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1, 1, 22050); s.connect(ctx.destination); s.start(0);
  }
  async function startIntro(){
    await loading;
    if (!ctx || !buf.intro) return;
    const b = buf.intro, ed = edges(b), g = ctx.createGain(), src = ctx.createBufferSource();
    src.buffer = b; src.loop = true; src.loopStart = ed.start; src.loopEnd = ed.end;
    src.connect(g); g.connect(ctx.destination);
    const t = ctx.currentTime + 0.05;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(1, t + FADE_IN);
    src.start(t, ed.start);
    intro = { src, g };
  }
  function curve(up, scale){ const n = 64, a = new Float32Array(n); for (let i = 0; i < n; i++){ const x = i / (n - 1); a[i] = scale * (up ? Math.sin(x * Math.PI / 2) : Math.cos(x * Math.PI / 2)); } return a; }
  const running = () => !!(ctx && ctx.state === 'running' && buf.outro);
  function playOutro(t, fade){
    const b = buf.outro, ed = edges(b), dur = ed.end - ed.start;
    const g = ctx.createGain(), src = ctx.createBufferSource();
    src.buffer = b; src.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0, ctx.currentTime);
    g.gain.setValueCurveAtTime(curve(true, 1), t, fade);
    g.gain.setValueAtTime(1, t + dur - FADE_OUT);
    g.gain.linearRampToValueAtTime(0, t + dur - 0.02);
    src.start(t, ed.start, dur);
    outro = { src, g, start: t, dur };
    return { start: t, dur, clock: 'audio' };
  }
  // Uten lyd (blokkert/feil) går veksten på vanlig klokke med samme lengde
  const fallback = () => ({ start: performance.now() / 1000, dur: OUTRO_FALLBACK, clock: 'perf' });
  // Returnerer når outroen starter og hvor lang den er – vekst-timelinen synkes mot dette
  function toOutro(){
    if (!running()) return fallback();
    const t = ctx.currentTime + 0.05;
    if (intro){
      const cur = intro.g.gain.value;
      intro.g.gain.cancelScheduledValues(0); intro.g.gain.setValueAtTime(cur, ctx.currentTime);
      intro.g.gain.setValueCurveAtTime(curve(false, cur), t, XFADE);
      intro.src.stop(t + XFADE + 0.1);
      intro = null;
    }
    return playOutro(t, XFADE);
  }
  function replay(){
    if (!running()) return fallback();
    if (outro){ try { outro.src.stop(); } catch (e) {} }
    return playOutro(ctx.currentTime + 0.05, 0.6);
  }
  const now = () => ctx ? ctx.currentTime : performance.now() / 1000;
  return { init, unlock, startIntro, toOutro, replay, now, get ready(){ return loading; } };
})();

/* ---------- Hint-tekst ---------- */
function say(text, delay = 0){
  gsap.killTweensOf(hint);
  return gsap.timeline({ delay })
    .to(hint, { autoAlpha: 0, duration: 0.35, ease: EASE })
    .call(() => { hint.textContent = text; })
    .to(hint, { autoAlpha: text ? 0.85 : 0, duration: 0.6, ease: EASE });
}

/* ---------- 3D-kamera ----------
   Kameraet står i (x, y, z) og ser langs +z. Et punkt på dybde z vises med skala s = F / (z − cam.z),
   så sluttplanet z = 0 er 1:1 når cam.z = −F. Alle linjer får --cam = s, så linjetykkelsen er låst. */
const F = 800, NEAR = 30;
const cam = { x: 200, y: 400, z: -F, roll: 0, kick: 0 };   // kick = liten zoom-puls på slagene
const CAM_VASE = { x: 215, y: 587, z: -640 };     // nærbildet av vasen i scene 3
const camEl = $('#cam'), worldEl = $('#world');
let camScale = 1;
const f2 = n => Math.round(n * 100) / 100;
function proj(x, y, z){ const d = z - cam.z; if (d < NEAR) return null; const s = F * (1 + cam.kick) / d; return [200 + (x - cam.x) * s, 400 + (y - cam.y) * s, s, d]; }
// Plasser en gruppe hvis innhold ligger i verdenskoordinater på dybde z (k = ekstra skala, rot = rotasjon, begge om (kx, ky))
function placePlane(elm, z, k = 1, kx = 200, ky = 330, rot = 0){
  const d = z - cam.z;
  if (d < NEAR){ if (elm._vis !== false){ elm.setAttribute('visibility', 'hidden'); elm._vis = false; } return 0; }
  if (elm._vis !== true){ elm.setAttribute('visibility', 'visible'); elm._vis = true; }
  const s = F * (1 + cam.kick) / d;
  elm.setAttribute('transform', `translate(${f2(200 - cam.x * s)},${f2(400 - cam.y * s)}) scale(${s.toFixed(5)})`
    + (k !== 1 ? ` translate(${kx},${ky}) scale(${k.toFixed(4)}) translate(${-kx},${-ky})` : '')
    + (rot ? ` rotate(${f2(rot)} ${kx} ${ky})` : ''));
  elm.style.setProperty('--cam', (s * k).toFixed(4));
  return s;
}
function renderCam(){
  camScale = placePlane(camEl, 0) || camScale;
  worldEl.setAttribute('transform', cam.roll ? `rotate(${f2(cam.roll)} 200 400)` : '');
}
renderCam();

/* ---------- Vannkanne og helling ---------- */
const JUG_REST = { x: 306, y: 468 };
const jug = { x: 470, y: 360, a: 18 };               // a = helling i grader (positiv = heller)
const SPOUT = [-48, -50];
const jugEl = $('#jug');
function renderJug(){ jugEl.setAttribute('transform', `translate(${f1(jug.x)},${f1(jug.y)}) rotate(${f1(-jug.a)})`); }
function spoutPos(){
  const r = -jug.a * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  return [jug.x + SPOUT[0] * c - SPOUT[1] * s, jug.y + SPOUT[0] * s + SPOUT[1] * c];
}
let jugActive = false, filled = false, fill = 0, invite = null, autoPour = null;

function bringJug(){
  renderJug();
  gsap.timeline()
    .set(jugEl, { visibility: 'visible' })
    .to(jug, { x: JUG_REST.x, y: JUG_REST.y, a: 0, duration: 1.3, ease: EASE_OUT, onUpdate: renderJug })
    .add(() => {
      jugActive = true;
      say('Dra eller trykk på kanna for å vanne');
      if (!G.tl) buildGrowth(OUTRO_FALLBACK);   // bygg veksten nå, så crossfaden ikke hakker
      cueVideo();                               // filmen står klar på 2,0 s
      invite = gsap.timeline({ repeat: -1, repeatDelay: 2.4, delay: 1.2 })
        .to(jug, { a: 9, duration: 0.45, ease: EASE, onUpdate: renderJug })
        .to(jug, { a: 0, duration: 0.6, ease: EASE, onUpdate: renderJug });
      if (MODE === 'pour') startAutoPour();
    });
}

function svgPoint(e){ const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
let drag = null;
jugEl.addEventListener('pointerdown', e => {
  if (!jugActive || filled) return;
  e.preventDefault();
  try { jugEl.setPointerCapture(e.pointerId); } catch (err) {}
  if (invite){ invite.kill(); invite = null; }
  if (autoPour) return;
  gsap.killTweensOf(jug);
  const p = svgPoint(e);
  drag = { x: p.x, y: p.y, t: performance.now(), moved: 0, id: e.pointerId };
});
jugEl.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = svgPoint(e), dx = (p.x - drag.x) / camScale, dy = (p.y - drag.y) / camScale;
  drag.moved = Math.max(drag.moved, Math.hypot(dx, dy));
  jug.a = clamp((-dx * 0.9 + dy * 0.7) * 0.8, 0, 72);
  jug.x = JUG_REST.x + clamp(dx * 0.2, -12, 12);
  jug.y = JUG_REST.y + clamp(dy * 0.2, -10, 14);
  renderJug();
});
function endDrag(e){
  if (!drag || e.pointerId !== drag.id) return;
  const wasTap = drag.moved < 8 && performance.now() - drag.t < 450;
  drag = null;
  if (filled) return;
  if (wasTap) startAutoPour();
  else gsap.to(jug, { a: 0, x: JUG_REST.x, y: JUG_REST.y, duration: 0.7, ease: EASE, onUpdate: renderJug });
}
jugEl.addEventListener('pointerup', endDrag);
jugEl.addEventListener('pointercancel', endDrag);

function startAutoPour(){
  if (invite){ invite.kill(); invite = null; }
  gsap.killTweensOf(jug);
  autoPour = gsap.to(jug, { a: 62, x: JUG_REST.x - 4, y: JUG_REST.y + 8, duration: 0.8, ease: EASE, onUpdate: renderJug });
}

/* Vannstråle, vannflate, dråper */
const stream = { u0: 0, u1: 0 };
const W_EMPTY = 792, W_FULL = 668;
let wavePhase = 0, lastDrop = 0;
const waterBody = $('#waterBody'), waterLine = $('#waterLine'), streamBody = $('#streamBody'), streamLine = $('#streamLine'), drops = $('#drops');
function level(){ return W_EMPTY + (W_FULL - W_EMPTY) * fill; }

function drawWater(pouring){
  const y = level(), amp = pouring ? 2.2 : 0.9;
  let top = '';
  for (let x = 110; x <= 290; x += 10) top += `${x === 110 ? 'M' : 'L'}${x},${f1(y + amp * Math.sin(x * 0.09 + wavePhase))}`;
  waterLine.setAttribute('d', fill > 0.002 ? top : '');
  waterBody.setAttribute('d', fill > 0.002 ? `${top} L290,800 L110,800 Z` : '');
}
function streamGeom(){
  const [sx, sy] = spoutPos(), ex = clamp(sx + 2, 232, 250), ey = level();
  const cx = sx - 9, cy = sy + 14;
  const P = u => [(1-u)*(1-u)*sx + 2*(1-u)*u*cx + u*u*ex, (1-u)*(1-u)*sy + 2*(1-u)*u*cy + u*u*ey];
  const D = u => [2*(1-u)*(cx - sx) + 2*u*(ex - cx), 2*(1-u)*(cy - sy) + 2*u*(ey - cy)];
  return { P, D, ex, ey };
}
function drawStream(){
  if (stream.u1 - stream.u0 < 0.01){ streamBody.setAttribute('d', ''); streamLine.setAttribute('d', ''); return; }
  const g = streamGeom(), L = [], R = [], mid = [];
  for (let i = 0; i <= 16; i++){
    const u = stream.u0 + (stream.u1 - stream.u0) * i / 16, [px, py] = g.P(u), [dx, dy] = g.D(u);
    const len = Math.hypot(dx, dy) || 1, w = 2.6 - 1.1 * u, nx = -dy / len * w, ny = dx / len * w;
    L.push(`${f1(px + nx)},${f1(py + ny)}`); R.unshift(`${f1(px - nx)},${f1(py - ny)}`); mid.push(`${f1(px + nx * 0.3)},${f1(py + ny * 0.3)}`);
  }
  streamBody.setAttribute('d', `M${L.join(' L')} L${R.join(' L')} Z`);
  streamLine.setAttribute('d', `M${mid.join(' L')}`);
}
function splash(x, y){
  const d = el('circle', { cx: f1(x), cy: f1(y), r: 1.6, fill: Math.random() < 0.5 ? C.cream : C.accent }, drops);
  const dx = (Math.random() - 0.5) * 22, up = 8 + Math.random() * 12;
  gsap.timeline({ onComplete: () => d.remove() })
    .to(d, { attr: { cy: y - up }, x: dx * 0.5, duration: 0.28, ease: EASE_OUT })
    .to(d, { attr: { cy: y + 3 }, x: dx, opacity: 0, duration: 0.32, ease: EASE_IN });
  if (Math.random() < 0.35){
    const r = el('ellipse', { cx: f1(x), cy: f1(y), rx: 2, ry: 0.6, class: 'ln', stroke: C.cream, 'stroke-opacity': 0.6 }, drops);
    gsap.to(r, { attr: { rx: 22, ry: 3 }, opacity: 0, duration: 0.9, ease: EASE_OUT, onComplete: () => r.remove() });
  }
}

gsap.ticker.add((time, dtMs) => {
  const dt = Math.min(dtMs, 50) / 1000 * speed;
  const rate = filled ? 0 : clamp((jug.a - 28) / 30, 0, 1) * 0.5;
  const pouring = rate > 0;
  if (pouring && !G.swayStopped){ G.swayStopped = true; stopSway(); }   // stilkene i ro før veksten (lik filmen)
  wavePhase += dt * (pouring ? 7 : 2);
  if (pouring){
    if (stream.u0 >= stream.u1){ stream.u0 = 0; stream.u1 = 0; }
    stream.u0 = Math.max(0, stream.u0 - dt * 4);
    stream.u1 = Math.min(1, stream.u1 + dt * 4);
    if (stream.u1 >= 1){
      fill = Math.min(1, fill + rate * dt);
      if (time - lastDrop > 0.07){ lastDrop = time; const g = streamGeom(); splash(g.ex, g.ey); }
      if (fill >= 1 && !filled) onFilled();
    }
  } else if (stream.u1 > 0){
    stream.u0 = Math.min(stream.u1, stream.u0 + dt * 4);
    if (stream.u0 >= stream.u1){ stream.u0 = stream.u1 = 0; }
  }
  if ((jugActive || fill > 0) && !V.on) drawWater(pouring);
  drawStream();
  growthTick(dt);
  videoTick();
});

/* Vasen er full: crossfade til outroen, vekst-timelinen starter */

  filled = true; jugActive = false;

  startGrowth(out);
}

/* ---------- Kransens geometri (= det godkjente sluttbildet v2) ---------- */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function smooth(pts){
  let d = `M${f1(pts[0][0])},${f1(pts[0][1])}`;
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += `C${f1(p1[0] + (p2[0] - p0[0]) / 6)},${f1(p1[1] + (p2[1] - p0[1]) / 6)} ${f1(p2[0] - (p3[0] - p1[0]) / 6)},${f1(p2[1] - (p3[1] - p1[1]) / 6)} ${f1(p2[0])},${f1(p2[1])}`;
  }
  return d;
}
const RING = { cx: 200, cy: 330, rx: 158, ry: 238 };
function ringPt(deg, dr = 0){ const t = deg * Math.PI / 180; return [RING.cx + (RING.rx + dr) * Math.cos(t), RING.cy + (RING.ry + dr) * Math.sin(t)]; }
const GOLD = 137.50776 * Math.PI / 180;
function mixHex(a, b, t){ const p = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)); const A = p(a), B = p(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
function petalPath(L, w){ return `M0,0 C${f1(w)},${f1(-L * 0.3)} ${f1(w * 0.8)},${f1(-L * 0.9)} 0,${f1(-L)} C${f1(-w * 0.8)},${f1(-L * 0.9)} ${f1(-w)},${f1(-L * 0.3)} 0,0Z`; }

const Flowers = {
  // Phyllotaxis-skive med kronbladkrans
  phyllo(g, R, cols){
    const petals = el('g', { class: 'petals' }, g), n = Math.round(14 + R / 3);
    [[cols[0], 1.0, 0], [cols[1], 0.78, 0.5]].forEach(([col, k, off]) => {
      for (let i = 0; i < n; i++) el('path', { class: 'petal', d: petalPath(R * k, R * 0.17), fill: col }, el('g', { transform: `rotate(${f1((i + off) * 360 / n)}) translate(0,${f1(-R * 0.36)})` }, petals));
    });
    const disc = el('g', { class: 'disc' }, g);
    el('circle', { r: f1(R * 0.47), fill: C.redD }, disc);
    const N = Math.round(R * 3.2);
    for (let i = 1; i <= N; i++){
      const t = i / N, r = R * 0.44 * Math.sqrt(t), a = i * GOLD;
      el('circle', { class: 'seed', cx: f1(r * Math.cos(a)), cy: f1(r * Math.sin(a)), r: f1((0.55 + 1.1 * Math.sqrt(t)) * R / 36), fill: t < 0.5 ? mixHex(C.mustard, C.orange, t * 2) : mixHex(C.orange, C.red, (t - 0.5) * 2) }, disc);
    }
  },
  daisy(g, R, cols){
    const petals = el('g', { class: 'petals' }, g), n = 11;
    for (let i = 0; i < n; i++) el('path', { class: 'petal', d: petalPath(R, R * 0.24), fill: cols[i % 2 ? 1 : 0] }, el('g', { transform: `rotate(${f1(i * 360 / n)}) translate(0,${f1(-R * 0.16)})` }, petals));
    const disc = el('g', { class: 'disc' }, g);
    el('circle', { r: f1(R * 0.27), fill: C.mustard }, disc);
    for (let i = 1; i <= 14; i++){ const r = R * 0.22 * Math.sqrt(i / 14), a = i * GOLD; el('circle', { class: 'seed', cx: f1(r * Math.cos(a)), cy: f1(r * Math.sin(a)), r: f1(R * 0.035), fill: C.redD }, disc); }
  },
  ranunculus(g, R, cols){
    const petals = el('g', { class: 'petals' }, g);
    for (let k = 0; k < 4; k++){
      const rk = R * (1 - k * 0.23), m = 7 - k;
      for (let i = 0; i < m; i++){ const a = (i / m) * Math.PI * 2 + k * 0.5; el('circle', { class: 'petal', cx: f1(Math.cos(a) * rk * 0.52), cy: f1(Math.sin(a) * rk * 0.52), r: f1(rk * 0.5), fill: cols[k % cols.length] }, petals); }
    }
    el('circle', { class: 'disc', r: f1(R * 0.14), fill: C.redD }, g);
  },
  poppy(g, R, cols){
    const petals = el('g', { class: 'petals' }, g);
    for (let i = 0; i < 4; i++){ const a = (45 + i * 90) * Math.PI / 180; el('circle', { class: 'petal', cx: f1(Math.cos(a) * R * 0.42), cy: f1(Math.sin(a) * R * 0.42), r: f1(R * 0.6), fill: cols[0] }, petals); }
    for (let i = 0; i < 4; i++){ const a = (i * 90) * Math.PI / 180; el('circle', { class: 'petal', cx: f1(Math.cos(a) * R * 0.28), cy: f1(Math.sin(a) * R * 0.28), r: f1(R * 0.46), fill: cols[1] }, petals); }
    const disc = el('g', { class: 'disc' }, g);
    el('circle', { r: f1(R * 0.22), fill: C.bg }, disc);
    let d = ''; for (let i = 0; i < 10; i++){ const a = i * Math.PI / 5; d += `M${f1(Math.cos(a) * R * 0.24)},${f1(Math.sin(a) * R * 0.24)} L${f1(Math.cos(a) * R * 0.42)},${f1(Math.sin(a) * R * 0.42)}`; }
    el('path', { class: 'ln seed', d, stroke: C.bg }, disc);
  },
  // 70-talls stripesol (som solen i California-plakaten)
  stripeSun(g, R, cols){
    const petals = el('g', { class: 'petals' }, g);
    el('circle', { class: 'petal', r: f1(R), fill: cols[0] }, petals);
    for (let k = 0; k < 4; k++){
      const y0 = R * (0.1 + k * 0.23), y1 = y0 + R * 0.1; if (y1 >= R) break;
      const w0 = Math.sqrt(R * R - y0 * y0) + 1, w1 = Math.sqrt(R * R - y1 * y1) + 1;
      el('path', { class: 'petal', d: `M${f1(-w0)},${f1(y0)} L${f1(w0)},${f1(y0)} L${f1(w1)},${f1(y1)} L${f1(-w1)},${f1(y1)}Z`, fill: C.bg }, petals);
    }
  },
  // konsentriske ringer
  target(g, R, cols){
    const petals = el('g', { class: 'petals' }, g);
    for (let k = 0; k < 4; k++) el('circle', { class: 'petal', r: f1(R * (1 - k * 0.23)), fill: cols[k % cols.length] }, petals);
    el('circle', { class: 'disc', r: f1(R * 0.13), fill: C.bg }, g);
  },
  cosmos(g, R, cols){
    const petals = el('g', { class: 'petals' }, g), n = 8, w = R * 0.36, L = R;
    const d = `M0,0 C${f1(w)},${f1(-L * .2)} ${f1(w * 1.15)},${f1(-L * .8)} ${f1(w * .55)},${f1(-L)} L0,${f1(-L * .86)} L${f1(-w * .55)},${f1(-L)} C${f1(-w * 1.15)},${f1(-L * .8)} ${f1(-w)},${f1(-L * .2)} 0,0Z`;
    for (let i = 0; i < n; i++) el('path', { class: 'petal', d, fill: cols[i % 2] }, el('g', { transform: `rotate(${f1(i * 360 / n)})` }, petals));
    el('circle', { class: 'disc', r: f1(R * 0.2), fill: C.mustard }, g);
  },
  starburst(g, R, cols){
    const petals = el('g', { class: 'petals' }, g);
    [[R, R * 0.55, cols[0]], [R * 0.62, R * 0.34, cols[1]]].forEach(([ro, ri, col]) => {
      let d = ''; for (let i = 0; i < 24; i++){ const a = i * Math.PI / 12, r = i % 2 ? ri : ro; d += `${i ? 'L' : 'M'}${f1(Math.cos(a) * r)},${f1(Math.sin(a) * r)}`; }
      el('path', { class: 'petal', d: d + 'Z', fill: col }, petals);
    });
    el('circle', { class: 'disc', r: f1(R * 0.18), fill: C.cream }, g);
  },
  tulip(g, R, cols){
    const petals = el('g', { class: 'petals' }, g), r = v => f1(R * v);
    el('path', { class: 'petal', d: `M0,${r(.5)} C${r(-.9)},${r(.3)} ${r(-.8)},${r(-.6)} ${r(-.45)},${r(-1)} L${r(-.15)},${r(-.45)} L0,${r(-.95)} L${r(.15)},${r(-.45)} L${r(.45)},${r(-1)} C${r(.8)},${r(-.6)} ${r(.9)},${r(.3)} 0,${r(.5)}Z`, fill: cols[0] }, petals);
    el('path', { class: 'petal', d: `M0,${r(.5)} C${r(-.4)},${r(.2)} ${r(-.35)},${r(-.5)} 0,${r(-.8)} C${r(.35)},${r(-.5)} ${r(.4)},${r(.2)} 0,${r(.5)}Z`, fill: cols[1] }, petals);

    el('circle', { class: 'disc', r: f1(R * 0.24), fill: C.cream }, g);
  }
};

// Bygger sluttbildet og returnerer delene veksten styrer. Rekkefølgen på rnd()-kallene er låst: den gir v2-geometrien.
function buildWreath(){
  const back = $('#wreathBack'), front = $('#wreathFront'), rnd = rng(7);
  back.innerHTML = ''; front.innerHTML = '';
  ['#haloNodes', '#bloomNodes', '#accentNodes', '#pollenPlane'].forEach(s => { $(s).innerHTML = ''; });
  const W = { halo: [], vines: [], leaves: [], branches: [], flowers: [], pollen: [] };
  // Stripebuer rundt kransen (70-talls tonebånd i brunt) – hver bue er en egen 3D-node
  const HALO = RAINBOW;
  HALO.forEach((col, k) => {
    const pts = []; for (let i = 0; i <= 40; i++) pts.push(ringPt(140 + 260 * i / 40, 40 + k * 5.5));
    const g = el('g', {}, $('#haloNodes'));
    el('path', { class: 'ln halo', d: smooth(pts), stroke: col }, g);
    W.halo.push({ el: g, z: 0, k: 1, op: 1 });
  });
  const vines = el('g', { id: 'vines' }, back), leaves = el('g', { id: 'leaves' }, back);
  // Fire ranker: to per side, faseforskjøvet så de fletter seg. Hovedrankene er stripebånd.
  const RIBBON = [C.kraftD, C.kraft, C.stem, C.kraftL], GAP = 4.2, side = {};
  [[1, 0, 7], [1, Math.PI, 5.5], [-1, 0.7, 7], [-1, 0.7 + Math.PI, 5.5]].forEach(([dir, ph, amp], vi) => {
    const pts = [[200 - dir * 3, 610]];
    for (let i = 0; i <= 30; i++){
      const t = i / 30 * 1.04, env = Math.min(1, t * 5);
      pts.push(ringPt(90 + dir * 180 * t, amp * env * Math.sin(t * Math.PI * 6 + ph)));
    }
    // andel av ranken ved hvert punkt – styrer blader, grener og logomasken
    const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    const frac = cum.map(c => c / cum[cum.length - 1]);
    if (vi % 2 === 0){
      side[dir] = { pts, frac };
      const rib = el('g', { class: 'ribbon' }, vines);
      RIBBON.forEach((col, k) => {
        const off = (k - (RIBBON.length - 1) / 2) * GAP * dir;
        const op = pts.map((p, i) => {
          const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
          return [p[0] - dy / l * off, p[1] + dx / l * off];
        });
        W.vines.push({ el: el('path', { class: 'ln vine', d: smooth(op), stroke: col }, rib) });
      });
    } else W.vines.push({ el: el('path', { class: 'ln vine', d: smooth(pts), stroke: C.stem }, vines) });
    // blader langs ranken
    for (let i = 3; i < pts.length - 2; i += 2){
      const [x, y] = pts[i], [nx, ny] = pts[i + 1], ang = Math.atan2(ny - y, nx - x) * 180 / Math.PI;
      const sd = (i + vi) % 4 < 2 ? 1 : -1, L = 13 + rnd() * 8, w = 4.5 + rnd() * 2.5;
      const lf = { x: f1(x), y: f1(y), rot: f1(ang + sd * (38 + rnd() * 20)), p: frac[i], k: 1 };
      lf.el = el('g', { class: 'leaf', transform: `translate(${lf.x},${lf.y}) rotate(${lf.rot})` }, leaves);
      el('path', { d: `M0,0 Q${f1(L / 2)},${f1(-w)} ${f1(L)},0 Q${f1(L / 2)},${f1(w)} 0,0Z`, fill: C.leaf }, lf.el);
      el('path', { class: 'ln', d: `M0,0 L${f1(L * 0.85)},0`, stroke: C.stem }, lf.el);
      W.leaves.push(lf);
    }
  });
  // vinkel på ellipsen → andel av hovedranken på samme side
  W.fracAt = deg => {
    let a = ((deg % 360) + 360) % 360, dir, t;
    if (a >= 90 && a <= 270){ dir = 1; t = (a - 90) / 180; } else { dir = -1; if (a > 270) a -= 360; t = (90 - a) / 180; }
    const sf = side[dir]; return sf.frac[clamp(Math.round(t / 1.04 * 30) + 1, 1, sf.pts.length - 1)];
  };
  // høyden til rankehodet ved andel p (venstre hovedranke)
  W.headY = p => {
    const { pts, frac } = side[1]; let i = 1; while (i < frac.length - 1 && frac[i] < p) i++;
    const u = frac[i] > frac[i - 1] ? clamp((p - frac[i - 1]) / (frac[i] - frac[i - 1]), 0, 1) : 0;
    return pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * u;
  };

  // Logo i midten
  const LW = 190, LH = LW * 1237 / 820;
  // 70vibe: regnbue-ekstrudering bak logoen, som bokstavene på VHS-coveret
  const lmask = el('mask', { id: 'logoShape', maskUnits: 'userSpaceOnUse', x: -200, y: -200, width: 800, height: 1200, style: 'mask-type:alpha' }, svg.querySelector('defs'));
  el('image', { href: '../assets/logo.png', x: f1(200 - LW / 2), y: f1(322 - LH / 2), width: LW, height: f1(LH) }, lmask);
  const echoG = el('g', { id: 'logoEcho', visibility: 'hidden' }, front);
  W.echo = RAINBOW_REV.map((col, i) => {
    const g = el('g', {}, echoG);
    el('rect', { x: f1(200 - LW / 2 - 4), y: f1(322 - LH / 2 - 4), width: f1(LW + 8), height: f1(LH + 8), fill: col, mask: 'url(#logoShape)' }, g);
    return { g, k: RAINBOW.length - i };
  });
  W.logo = el('image', { id: 'logo', href: '../assets/logo.png', x: f1(200 - LW / 2), y: f1(322 - LH / 2), width: LW, height: f1(LH) }, front);
  W.logoBox = { x: 200 - LW / 2, y: 322 - LH / 2, w: LW, h: LH };

  const branches = el('g', { id: 'branches' }, front);
  WREATH.forEach(([deg, type, R, cols, dr], idx) => {
    const j = (rnd() - 0.5) * 6, [bx, by] = ringPt(deg + j, 0), [x, y] = ringPt(deg + j, dr), p = W.fracAt(deg + j);
    if (Math.hypot(x - bx, y - by) > 4) W.branches.push({ p, el: el('path', { class: 'ln', d: `M${f1(bx)},${f1(by)} Q${f1((bx + x) / 2 + (rnd() - 0.5) * 8)},${f1((by + y) / 2 + (rnd() - 0.5) * 8)} ${f1(x)},${f1(y)}`, stroke: C.stem }, branches) });
    const rot = f1(rnd() * 360);
    const g = el('g', { class: `flower ${type}`, transform: `translate(${f1(x)},${f1(y)}) rotate(${rot})` }, $(type === 'accent' ? '#accentNodes' : '#bloomNodes'));
    Flowers[type](g, R, type === 'accent' ? null : type === 'ranunculus' ? PAL_RINGS[idx % 8] : type === 'poppy' ? [C.red, C.pink] : PAL_WARM[idx % 8]);
    W.flowers.push({ el: g, type, R, idx, p, xf: f1(x), yf: f1(y), rf: rot, n: { x: f1(x), y: f1(y), z: 0, r: rot } });
  });
  // Pollen (statisk i sluttbildet)
  for (let i = 0; i < 46; i++){
    const [x, y] = ringPt(rnd() * 360, (rnd() - 0.5) * 90);
    W.pollen.push(el('circle', { cx: f1(x), cy: f1(y), r: f1(0.7 + rnd() * 1.5), fill: rnd() < 0.7 ? C.mustard : C.cream, opacity: f1(0.35 + rnd() * 0.55) }, $('#pollenPlane')));
  }
  buildExtras(W, back, front);
  return W;
}

/* ---------- Maksimalistiske lag rundt heltene (egen rng, så heltegeometrien står fast) ---------- */
const PAL_WARM = [[C.pink, C.yellow], [C.orange, C.red], [C.cyan, C.blue], [C.green, C.yellow], [C.purple, C.pink], [C.red, C.orange], [C.yellow, C.orange], [C.blue, C.cyan]];
const PAL_RINGS = [0, 1, 2, 3, 4, 5, 6, 7].map(i => [0, 1, 2, 3].map(k => RAINBOW[(i + k * 2) % 8]));
const LEAF_COLS = ['#3F8F5C', C.green, '#2E6B55', '#7DBB5A'];
const BERRY_COLS = [C.red, C.redD, '#C2452A'];
function leafLance(g, L, w, col){ el('path', { d: `M0,0 Q${f1(L / 2)},${f1(-w)} ${f1(L)},0 Q${f1(L / 2)},${f1(w)} 0,0Z`, fill: col }, g); el('path', { class: 'ln', d: `M0,0 L${f1(L * .85)},0`, stroke: C.stem }, g); }
function leafFrond(g, L, col){
  el('path', { class: 'ln', d: `M0,0 L${f1(L)},0`, stroke: C.stem }, g);
  for (let i = 1; i <= 6; i++){
    const x = L * i / 7, l = L * 0.34 * (1 - i / 9);
    [-1, 1].forEach(s => el('path', { d: `M0,0 Q${f1(l / 2)},${f1(-l * .3)} ${f1(l)},0 Q${f1(l / 2)},${f1(l * .3)} 0,0Z`, fill: col }, el('g', { transform: `translate(${f1(x)},0) rotate(${s * 50})` }, g)));
  }
}
function leafRound(g, col){ el('path', { class: 'ln', d: 'M0,0 L16,0', stroke: C.stem }, g); el('circle', { cx: 6, cy: -3, r: 4.6, fill: col }, g); el('circle', { cx: 13, cy: 2, r: 3.8, fill: col }, g); }
function colsFor(type, pick){
  return type === 'target' || type === 'ranunculus' ? pick(PAL_RINGS) : type === 'berries' ? BERRY_COLS : type === 'stripeSun' ? [pick([C.mustard, C.orange, C.coral])] : pick(PAL_WARM);
}
function buildExtras(W, back, front){
  const xr = rng(99), pick = a => a[Math.floor(xr() * a.length)], LB = W.logoBox;
  const xb = el('g', { id: 'extraBack' }, back), xf = el('g', { id: 'extraFront' }, front);
  W.extras = []; W.garlands = [];
  const hitsLogo = (x, y, r) => x + r > LB.x - 6 && x - r < LB.x + LB.w + 6 && y + r > LB.y - 6 && y - r < LB.y + LB.h + 6;
  const fits = (x, y, r) => x - r > 3 && x + r < 397 && y - r > 4;
  const ringOk = deg => { const a = ((deg % 360) + 360) % 360; return a < 72 || a > 108; };   // bunnen er buketten
  const add = (parent, x, y, rot, p, build) => {
    const g = el('g', { transform: `translate(${f1(x)},${f1(y)}) rotate(${f1(rot)})` }, parent); build(g);
    W.extras.push({ el: g, x: f1(x), y: f1(y), rot: f1(rot), p: p * 0.9, k: 1 });
  };
  const bloomType = (g, type, R) => Flowers[type](g, R, colsFor(type, pick));

  // Bølgete solstråler i brunt bak alt (sol/bølge-plakaten)
  const rays = el('g', {}, null), N = 28, wv = t => 0.14 * Math.sin(t * 2.4);
  for (let i = 0; i < N; i += 2){
    const a0 = i / N * Math.PI * 2, a1 = (i + 1) / N * Math.PI * 2, L = [], R = [];
    for (let s = 0; s <= 12; s++){
      const t = 1.32 + s / 12 * 2.8, w = wv(t);
      L.push([200 + RING.rx * t * Math.cos(a0 + w), 330 + RING.ry * t * Math.sin(a0 + w)]);
      R.unshift([200 + RING.rx * t * Math.cos(a1 + w), 330 + RING.ry * t * Math.sin(a1 + w)]);
    }
    el('path', { d: 'M' + L.concat(R).map(p => `${f1(p[0])},${f1(p[1])}`).join(' L') + 'Z', fill: ['#2E1A2C', '#1E1E34', '#14292E', '#1A2A1C', '#2C2914', '#30200F', '#301616'][(i / 2) % 7] }, rays);
  }
  $('#haloNodes').insertBefore(rays, $('#haloNodes').firstChild);
  W.rays = { el: rays, z: 0, k: 1, op: 1, rot: 0 };

  // Blader, bregner og eukalyptus tett langs hele kransen
  for (let deg = 110; deg <= 430; deg += 6.5){
    if (!ringOk(deg)) continue;
    const p = W.fracAt(deg);
    for (const s of [-1, 1]){
      const [x, y] = ringPt(deg + (xr() - .5) * 4, (xr() - 0.3) * 14), rot = deg + s * (25 + xr() * 45), kind = xr(), col = pick(LEAF_COLS);
      add(xb, x, y, rot, p, g => kind < .55 ? leafLance(g, 18 + xr() * 13, 4.5 + xr() * 2.5, col) : kind < .82 ? leafFrond(g, 22 + xr() * 12, col) : leafRound(g, col));
    }
  }
  // Grasstrå med frø som stikker ut
  for (let deg = 118; deg <= 422; deg += 17){
    if (!ringOk(deg)) continue;
    const [x, y] = ringPt(deg, 4), L = 28 + xr() * 26, rot = deg + (xr() - .5) * 30;
    if (!fits(x + Math.cos(rot * Math.PI / 180) * L, y + Math.sin(rot * Math.PI / 180) * L, 3)) continue;
    add(xb, x, y, rot, W.fracAt(deg), g => {
      let d = `M0,0 Q${f1(L * .5)},${f1((xr() - .5) * 8)} ${f1(L)},0`;
      for (let i = 0; i < 4; i++){ const tx = f1(L * (0.55 + i * 0.13)); d += ` M${tx},0 l5,-4 M${tx},0 l5,4`; }
      el('path', { class: 'ln', d, stroke: xr() < .5 ? C.kraftL : C.cream }, g);
      el('circle', { cx: f1(L), cy: 0, r: 2.2, fill: C.mustard }, g);
    });
  }
  // Indre ring: små blomster og bær (holder seg unna logoen)
  for (let deg = 116; deg <= 424; deg += 10.5){
    if (!ringOk(deg)) continue;
    const R = 5 + xr() * 6, [x, y] = ringPt(deg + (xr() - .5) * 5, -26 - xr() * 8), type = pick(['accent', 'berries', 'starburst', 'target', 'accent', 'tulip']);
    if (hitsLogo(x, y, R)) continue;
    add(xf, x, y, type === 'tulip' || type === 'berries' ? deg + 90 : xr() * 360, W.fracAt(deg), g => bloomType(g, type, R));
  }
  // Ytre ring: 70-tallsformer – stripesoler, blinker, cosmos, stjerner, tulipaner
  for (let deg = 114; deg <= 426; deg += 12.5){
    if (!ringOk(deg)) continue;
    let R = 10 + xr() * 8, dr = 24 + xr() * 12, j = (xr() - .5) * 6, [x, y] = ringPt(deg + j, dr);
    while (!fits(x, y, R) && dr > 8){ dr -= 4; R = Math.max(8, R - 1); [x, y] = ringPt(deg + j, dr); }
    if (!fits(x, y, R)) continue;
    const type = pick(['cosmos', 'starburst', 'target', 'stripeSun', 'tulip', 'cosmos', 'target', 'berries']);
    add(xf, x, y, type === 'tulip' || type === 'berries' ? deg + j + 90 : xr() * 360, W.fracAt(deg), g => bloomType(g, type, R));
  }
  // Girlandere som henger ned langs vasen
  [[1, 118], [-1, 62]].forEach(([s, deg]) => {
    const [x0, y0] = ringPt(deg, 4), X = v => 200 + s * (v - 200);
    const P = [[x0, y0], [X(60), 600], [X(112), 700], [X(46), 784]];
    const bez = u => { const m = 1 - u; return [0, 1].map(i => m * m * m * P[0][i] + 3 * m * m * u * P[1][i] + 3 * m * u * u * P[2][i] + u * u * u * P[3][i]); };
    W.garlands.push({ p0: 0.1, el: el('path', { class: 'ln', d: `M${f1(x0)},${f1(y0)} C${P.slice(1).map(p => `${f1(p[0])},${f1(p[1])}`).join(' ')}`, stroke: C.stem }, xb) });
    for (let i = 1; i <= 11; i++){
      const u = i / 12, [x, y] = bez(u), [x2, y2] = bez(Math.min(1, u + 0.01)), ang = Math.atan2(y2 - y, x2 - x) * 180 / Math.PI, p = (0.1 + 0.36 * u) / 0.9;
      [-1, 1].forEach(sd => add(xb, x, y, ang + sd * (40 + xr() * 30), p, g => xr() < .6 ? leafLance(g, 14 + xr() * 9, 4 + xr() * 2, pick(LEAF_COLS)) : leafFrond(g, 18 + xr() * 8, pick(LEAF_COLS))));
      if (i % 2 === 0){ const type = pick(['starburst', 'accent', 'cosmos', 'target']), R = 6 + xr() * 5; add(xf, x + s * 6, y, xr() * 360, p + 0.02, g => bloomType(g, type, R)); }
      if (i === 11) add(xf, x, y + 6, 180, p + 0.04, g => Flowers.tulip(g, 10, [C.coral, C.red]));   // hengende tulipan nederst
    }
  });
}

/* ====================== VEKST: 2,5D-showreel synket mot outroen ======================
   Akt 1  0–2,5    Gnisten: kapillær i petrol, knoppene slår ut
   Akt 2  2,5–10   Stilkene skyter: stripebånd gjennom rommet, kamera løftes og trekker seg bakover
   Akt 3a 10–12,6  Dykket inn i phyllotaxis-spiralen, punch-through
   Akt 3b 12,6–21  Blomstring på flere dybdeplan, bånd og streker forbi kamera
   Akt 4  21–26,5  Klimaks: dybden kollapser, blomstene lander i kransen, logoen avsløres av rankene
   Akt 5  26,5–40  Pust (stripebuene pulserer på 32,8 s) og sluttbildet holdes */
const G = { tl: null, W: null, on: false, idle: false, start: 0, t: 0, dur: OUTRO_FALLBACK, clock: 'perf', replayShown: false,
  vine: { p: 0 }, solid: { v: 0 }, lastZ: 0, velZ: 0, buds: null, rows: [] };
const fx = { streak: 0, pollen: 0, fall: 0, shapes: 0 };
const VINE_T0 = 23.0, VINE_D = 3.2;
const easeMain = gsap.parseEase(EASE);
function invEase(p){ let lo = 0, hi = 1; for (let i = 0; i < 28; i++){ const m = (lo + hi) / 2; if (easeMain(m) < p) lo = m; else hi = m; } return (lo + hi) / 2; }
const vineTime = p => VINE_T0 + VINE_D * invEase(p);

// Bånd gjennom rommet: 3D-kurver (u = 0…1) som tegnes som komethaler
const RIB_WARM = RAINBOW, RIB_BROWN = RAINBOW_REV, RIB_TEAL = [C.cyan, C.blue, C.purple];
function helix(o){ return u => { const a = o.w * u * Math.PI * 2 + o.ph, r = o.A * (o.grow ? 0.25 + u : 1);
  return [o.p[0] + o.d[0] * u + r * Math.cos(a), o.p[1] + o.d[1] * u + r * Math.sin(a) * 0.3, o.p[2] + o.d[2] * u + r * Math.sin(a)]; }; }

const RIB_GAP = 3.6, RIB_N = 56;
function renderRibbon(r){
  const u1 = Math.min(r.q, 1), u0 = Math.max(0, r.q - r.tail);
  if (u1 - u0 < 0.004){ if (r.on){ r.paths.forEach(p => p.setAttribute('d', '')); r.on = false; } return; }
  r.on = true;
  const P = [];
  for (let i = 0; i <= RIB_N; i++){ const w = r.f(u0 + (u1 - u0) * i / RIB_N); P.push(proj(w[0], w[1], w[2])); }
  const n = r.cols.length, ds = new Array(n).fill('');
  let pen = false, gsum = 0, gn = 0;
  for (let i = 0; i <= RIB_N; i++){
    const p = P[i];
    if (!p || Math.abs(p[0]) > 4000 || Math.abs(p[1]) > 4000){ pen = false; continue; }
    const a = P[i - 1] || p, b = P[i + 1] || p;
    let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const gap = clamp(RIB_GAP * p[2], 3.0, 60);    // båndet blir bredere når det nærmer seg kamera
    gsum += gap; gn++;
    for (let k = 0; k < n; k++){ const o = (k - (n - 1) / 2) * gap; ds[k] += `${pen ? 'L' : 'M'}${f1(p[0] - dy * o)},${f1(p[1] + dx * o)}`; }
    pen = true;
  }
  // trykte bånd som på VHS-coveret: tykke striper med smale mørke mellomrom
  const sw = f1(clamp((gn ? gsum / gn : 3) * 0.74, 1.8, 44));
  r.paths.forEach((path, k) => { path.setAttribute('d', ds[k]); path.style.strokeWidth = sw + 'px'; });
}

const MORPHS = [
  th => 0.58 + 0.42 * Math.pow(Math.abs(Math.cos(th * 4)), 0.7),
  th => 0.4 + 0.6 * Math.pow(Math.abs(Math.cos(th * 2.5)), 6),

  th => 0.22 + 0.78 * Math.pow(Math.abs(Math.cos(th * 2)), 0.45),

  for (let b = 0; 2.5 + b * 0.8 < 26; b++){ const t = 2.5 + b * 0.8; tl.set(cam, { kick: b % 4 === 0 ? 0.09 : 0.045 }, t); tl.to(cam, { kick: 0, duration: 0.6, ease: EASE_OUT }, t); }

function placeFlower(fl){
  const n = fl.n, op = n.op === undefined ? 1 : n.op, born = fl.tb === undefined || G.t >= fl.tb - 0.05;
  const p = op > 0.002 && born ? proj(n.x, n.y, n.z) : null;          // ikke tegnet før den blomstrer
  if (!p){ if (fl.vis !== false){ fl.el.setAttribute('visibility', 'hidden'); fl.vis = false; } return; }
  if (fl.vis !== true){ fl.el.setAttribute('visibility', 'visible'); fl.vis = true; }
  fl.el.setAttribute('transform', `translate(${f2(p[0])},${f2(p[1])}) scale(${p[2].toFixed(4)}) rotate(${f1(n.r)})`);
  fl.el.style.setProperty('--cam', p[2].toFixed(4));
  const fog = (p[3] <= 1400 ? 1 : Math.max(0.3, 1 - (p[3] - 1400) / 2200)) * op;   // luftperspektiv: langt borte = mørkere
  if (fog !== fl.fog){ fl.fog = fog; fl.el.setAttribute('opacity', fog.toFixed(3)); }
}
function placeNode(h){
  if (h.op <= 0.002){ if (h.el._vis !== false){ h.el.setAttribute('visibility', 'hidden'); h.el._vis = false; } return; }

}
// Sjokkbølger: stripete ringer i skjermrom som slår ut på de store anslagene
function placeWave(w){
  if (w.op <= 0.002){ if (w.el._vis !== false){ w.el.setAttribute('visibility', 'hidden'); w.el._vis = false; } return; }
  if (w.el._vis !== true){ w.el.setAttribute('visibility', 'visible'); w.el._vis = true; }
  w.el.setAttribute('transform', `translate(200,400) scale(${w.k.toFixed(4)})`);
  w.el.style.setProperty('--cam', w.k.toFixed(4));

}
function renderGrowth(dt){
  renderCam();
  placePlane($('#pollenPlane'), 0);
  const W = G.W;
  placeNode(W.rays); W.backdrops.forEach(placeNode); W.halo.forEach(placeNode); W.pulses.forEach(placeNode);
  G.morphs.forEach(placeMorph);
  G.transients.forEach(placeFlower); W.flowers.forEach(placeFlower);
  if (G.echo && G.echo.d !== G.echoD){ G.echoD = G.echo.d; W.echo.forEach(e => e.g.setAttribute('transform', `translate(${f1(e.k * G.echo.d * 0.85)},${f1(e.k * G.echo.d)})`)); }
  G.waves.forEach(placeWave);
  RIBBONS.forEach(renderRibbon);
  if (dt > 0){ const v = (cam.z - G.lastZ) / dt; G.velZ += (v - G.velZ) * Math.min(1, dt * 8); }
  G.lastZ = cam.z;
  renderFx(dt);

/* Partikler på canvas: streker langs dybden (linjer som skyter gjennom rommet) og pollen med parallakse */
const fxCv = $('#fx'), fxCtx = fxCv.getContext('2d');
let fxM = { a: 1, e: 0, f: 0 }, fxDpr = 1, fxDirty = false, streaks = [], motes = [], shapes = [];
// 70-tallsformer og blader som virvler gjennom rommet: 0 skive, 1 ring, 2 halvsirkel, 3 stjerne, 4 striper, 5 blad
const SHAPE_COLS = RAINBOW.concat([C.cream]);
function drawShape(c, t, s){
  c.beginPath();
  if (t === 0){ c.arc(0, 0, s, 0, Math.PI * 2); c.fill(); }
  else if (t === 1){ c.arc(0, 0, s, 0, Math.PI * 2); c.stroke(); }
  else if (t === 2){ c.arc(0, 0, s, 0, Math.PI); c.closePath(); c.fill(); }
  else if (t === 3){ for (let i = 0; i < 10; i++){ const a = i * Math.PI / 5 - Math.PI / 2, r = i % 2 ? s * 0.45 : s; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); } c.closePath(); c.fill(); }
  else if (t === 4){ for (let k = -1; k <= 1; k++){ c.moveTo(-s, k * s * 0.45); c.lineTo(s, k * s * 0.45); } c.stroke(); }
  else { c.moveTo(-s, 0); c.quadraticCurveTo(0, -s * 0.55, s, 0); c.quadraticCurveTo(0, s * 0.55, -s, 0); c.fill(); }
}
const STREAK_COLS = RAINBOW.concat([C.cream, C.cream]), MOTE_COLS = [C.yellow, C.cream, C.pink, C.cyan];
function sizeFx(){
  fxDpr = Math.min(2, window.devicePixelRatio || 1);
  fxCv.width = Math.round(innerWidth * fxDpr); fxCv.height = Math.round(innerHeight * fxDpr);
  const m = svg.getScreenCTM(); if (m) fxM = { a: m.a, e: m.e, f: m.f };
}
addEventListener('resize', sizeFx); sizeFx();
function spawnP(p, d0, d1){ const d = d0 + Math.random() * (d1 - d0); p.z = cam.z + d; p.x = cam.x + (Math.random() - 0.5) * d * 0.62; p.y = cam.y + (Math.random() - 0.5) * d * 1.15; }
function clearFx(){ fxCtx.setTransform(1, 0, 0, 1, 0, 0); fxCtx.clearRect(0, 0, fxCv.width, fxCv.height); }
function resetFx(){
  streaks = Array.from({ length: 200 }, (_, i) => { const p = { c: i % STREAK_COLS.length }; spawnP(p, 60, 2800); return p; });
  motes = Array.from({ length: 220 }, (_, i) => { const p = { c: i % MOTE_COLS.length, r: 0.7 + Math.random() * 1.6, vy: -(5 + Math.random() * 12), ph: Math.random() * 6.28 }; spawnP(p, 60, 2400); return p; });
  shapes = Array.from({ length: 150 }, (_, i) => {
    const t = i % 6, p = { t, col: t === 5 ? LEAF_COLS[i % 3] : SHAPE_COLS[i % SHAPE_COLS.length], size: (t === 5 ? 7 : 4) + Math.random() * 7, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 3 };
    spawnP(p, 120, 2600); return p;
  });
  clearFx(); fxDirty = false;
}
function renderFx(dt){
  if (fx.streak < 0.01 && fx.pollen < 0.01 && fx.shapes < 0.01){ if (fxDirty){ clearFx(); fxDirty = false; } return; }
  fxDirty = true;
  const c = fxCtx; clearFx();
  const k = fxDpr * fxM.a; c.setTransform(k, 0, 0, k, fxDpr * fxM.e, fxDpr * fxM.f);
  if (cam.roll){ c.translate(200, 400); c.rotate(cam.roll * Math.PI / 180); c.translate(-200, -400); }
  c.lineCap = 'round'; c.lineWidth = 2.2;                       // låst linjetykkelse også her
  if (fx.streak >= 0.01){
    const len = 24 + Math.min(1100, Math.abs(G.velZ) * 0.4);
    c.globalAlpha = fx.streak * 0.85;
    for (let ci = 0; ci < STREAK_COLS.length; ci++){
      c.strokeStyle = STREAK_COLS[ci]; c.beginPath();
      for (let i = ci; i < streaks.length; i += STREAK_COLS.length){
        const p = streaks[i], d = p.z - cam.z;
        if (d < NEAR + 5){ spawnP(p, 2000, 2800); continue; }
        if (d > 3000){ spawnP(p, 80, 1200); continue; }
        const a = proj(p.x, p.y, p.z), b = proj(p.x, p.y, p.z + len);
        if (!a || !b) continue;
        if (a[0] < -600 || a[0] > 1000 || a[1] < -800 || a[1] > 1600){ spawnP(p, 400, 2800); continue; }
        c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]);
      }
      c.stroke();
    }
  }
  if (fx.pollen >= 0.01){
    const now = G.fxTime !== undefined ? G.fxTime : performance.now() / 1000;
    c.globalAlpha = fx.pollen * 0.8;
    for (let ci = 0; ci < MOTE_COLS.length; ci++){
      c.fillStyle = MOTE_COLS[ci]; c.beginPath();
      for (let i = ci; i < motes.length; i += MOTE_COLS.length){
        const p = motes[i];
        p.y += (p.vy * (1 - fx.fall) + fx.fall * 26) * dt; p.x += Math.sin(now * 0.6 + p.ph) * 6 * dt;
        const d = p.z - cam.z;
        if (d < NEAR + 5 || d > 3000){ spawnP(p, 200, 2400); continue; }
        const a = proj(p.x, p.y, p.z);
        if (!a || a[0] < -40 || a[0] > 440 || a[1] < -60 || a[1] > 860){ spawnP(p, 200, 2400); continue; }
        const r = clamp(p.r * a[2], 0.4, 7);
        c.moveTo(a[0] + r, a[1]); c.arc(a[0], a[1], r, 0, Math.PI * 2);
      }
      c.fill();
    }
  }
  if (fx.shapes >= 0.01 && !G.noShapes){
    c.globalAlpha = fx.shapes;
    // én setTransform per form (raskere enn save/restore); rull og kamera regnes inn direkte
    const rr = cam.roll * Math.PI / 180, rc = Math.cos(rr), rs = Math.sin(rr);
    for (const p of shapes){
      p.rot += p.vr * dt; p.y -= 6 * dt;
      const d = p.z - cam.z;
      if (d < NEAR + 5){ spawnP(p, 1800, 2600); continue; }
      if (d > 3000){ spawnP(p, 150, 1400); continue; }
      const a = proj(p.x, p.y, p.z);
      if (!a || a[0] < -120 || a[0] > 520 || a[1] < -160 || a[1] > 960){ spawnP(p, 300, 2600); continue; }
      const sx = 200 + (a[0] - 200) * rc - (a[1] - 400) * rs, sy = 400 + (a[0] - 200) * rs + (a[1] - 400) * rc, t = rr + p.rot;
      c.setTransform(k * Math.cos(t), k * Math.sin(t), -k * Math.sin(t), k * Math.cos(t), k * sx + fxDpr * fxM.e, k * sy + fxDpr * fxM.f);
      c.fillStyle = c.strokeStyle = p.col;
      drawShape(c, p.t, clamp(p.size * a[2], 1.2, 80));
    }
  }
  c.globalAlpha = 1;
}

/* Klokke: outroens lydklokke når lyden går, ellers vanlig tid */
const growthNow = () => G.clock === 'audio' ? Sound.now() : performance.now() / 1000;
function startGrowth(out){
  say('');
  if (!G.tl) buildGrowth(out.dur);
  Object.assign(G, { start: out.start, dur: out.dur, clock: out.clock, on: true, idle: false, replayShown: false, lastZ: cam.z, velZ: 0 });
  console.info(`Vekst startet: klokke=${out.clock}, lengde=${out.dur.toFixed(2)} s`);
  resetFx();
}
function growthTick(dt){
  if (!G.on) return;
  const raw = (growthNow() - G.start) * (G.clock === 'perf' ? speed : 1);
  if (raw > G.dur + 0.3){
    if (!G.idle){ G.t = G.dur; G.tl.time(G.dur); renderGrowth(dt); G.idle = true; }
    if (!G.replayShown && raw > G.dur + 3) showReplay();
    return;
  }
  G.t = clamp(raw, 0, G.dur);
  // På mobil tar filmen over ved 2,0 s (kanna er da ute av bildet, og timelinen er lik)
  if (V.use && V.ok && G.t >= VIDEO_T0 && G.t < VIDEO_T0 + 2 && vid.readyState >= 2){ startVideo(); return; }
  G.tl.time(G.t);
  renderGrowth(dt);
}

/* ---------- Del 2 som forhåndsrendret film på mobil (video/vekst.mp4, rendres med render.js) ---------- */
const VIDEO_T0 = 2.0, VIDEO_FPS = 30, vid = $('#growthVideo');
const V = {
  use: params.get('video') ? params.get('video') === '1' : true,   // 70vibe: del 2 er alltid film
  ok: true, on: false, primed: false
};
if (MODE === 'render' || MODE === 'still') V.use = false;
if (V.use){ vid.muted = true; vid.src = 'video/vekst.mp4'; }
vid.addEventListener('error', () => { V.ok = false; if (V.on) videoFallback(); });
function placeVideo(){
  const W = innerWidth, H = innerHeight, s = Math.min(W / 400, H / 800);
  Object.assign(vid.style, { left: `${(W - 400 * s) / 2 - 60 * s}px`, top: `${(H - 800 * s) / 2 - 70 * s}px`, width: `${520 * s}px`, height: `${940 * s}px` });
}
addEventListener('resize', placeVideo); placeVideo();
function primeVideo(){              // kalles i et klikk: låser opp avspilling og buffring på iOS
  if (!V.use || V.primed) return;
  V.primed = true;
  const p = vid.play();
  if (p && p.then) p.then(() => { vid.pause(); cueVideo(); }).catch(() => {});
}
function cueVideo(){ if (V.use && V.ok){ try { vid.pause(); vid.currentTime = VIDEO_T0; } catch (e) {} } }
function startVideo(){
  V.on = true; G.on = false; V.lastVT = -1; V.stallSince = null;
  vid.playbackRate = 1;
  if (Math.abs(vid.currentTime - G.t) > 0.05) vid.currentTime = G.t;
  gsap.set(vid, { autoAlpha: 1 });
  const p = vid.play(); if (p && p.catch) p.catch(videoFallback);
  gsap.set('#stage', { visibility: 'hidden' }); clearFx(); fxDirty = false;
  console.info(`Film tar over ved ${G.t.toFixed(2)} s`);
}
function videoFallback(){           // filmen feilet: tilbake til levende kode der vi er
  V.on = false; V.ok = false;
  gsap.set(vid, { autoAlpha: 0 }); gsap.set('#stage', { visibility: 'visible' });
  G.on = true;
}
function videoTick(){
  if (!V.on) return;
  const t = (growthNow() - G.start) * (G.clock === 'perf' ? speed : 1);
  if (vid.ended || t >= G.dur - 0.05){ endVideo(); return; }
  // Vakt: står filmen fast (buffring, dekoder) i over 1 s mens musikken går, tar koden over der vi er
  if (vid.currentTime !== V.lastVT){ V.lastVT = vid.currentTime; V.stallSince = null; }
  else if (V.stallSince == null) V.stallSince = t;
  else if (t - V.stallSince > 1.0){ console.info('Filmen står fast – kode tar over'); videoFallback(); return; }
  if (!vid.paused && vid.readyState >= 2){
    const drift = vid.currentTime - t;   // filmtid = vekst-tid
    if (Math.abs(drift) > 0.5){ vid.currentTime = t; vid.playbackRate = 1; }
    else vid.playbackRate = Math.abs(drift) > 0.03 ? 1 - clamp(drift * 0.5, -0.1, 0.1) : 1;
    if (DEBUG && t - (V.logT || 0) > 2){ V.logT = t; console.info(`synk t=${t.toFixed(1)} avvik=${(drift * 1000).toFixed(0)} ms`); }
  }
}
function endVideo(){                // sluttbildet tegnes skarpt i vektor under filmen, så fades filmen ut
  V.on = false;
  G.t = G.dur; G.tl.time(G.dur); renderGrowth(0);
  gsap.set('#stage', { visibility: 'visible' });
  gsap.to(vid, { autoAlpha: 0, duration: 0.3, ease: EASE, onComplete: () => vid.pause() });
  G.on = true; G.idle = true;
  console.info('Film ferdig – sluttbildet er vektor igjen');
}

/* «Spill igjen» */
const replayBtn = $('#replayBtn');
function showReplay(){ G.replayShown = true; gsap.to(replayBtn, { autoAlpha: 1, duration: 1.2, ease: EASE }); }
replayBtn.addEventListener('click', () => {
  Sound.unlock();
  G.on = false;
  gsap.to(replayBtn, { autoAlpha: 0, duration: 0.4, ease: EASE });
  gsap.to(['#stage', '#fx'], { opacity: 0, duration: 0.7, ease: EASE, onComplete(){
    cueVideo(); gsap.set(vid, { autoAlpha: 0 }); gsap.set('#stage', { visibility: 'visible' });
    G.t = 0; G.tl.time(0); vineDrive(); resetFx(); renderGrowth(0);
    startGrowth(Sound.replay());
    gsap.to(['#stage', '#fx'], { opacity: 1, duration: 1.0, ease: EASE });
  } });
});

/* Utvikling: hopp rett til tilstanden etter vanningen */
function enterGrowthState(){
  $('#intro').style.display = 'none';
  gsap.set('#bouquet', { y: 0, scale: 1, visibility: 'visible' });
  gsap.set(['#vaseBack', '#vaseFront', '#water'], { y: 0, visibility: 'visible' });
  Object.assign(cam, CAM_VASE); renderCam();
  fill = 1; filled = true; drawWater(false);
}

/* ---------- 70vibe: regnbuesving på startskjermen, som på VHS-coveret ---------- */
function offsetPts(pts, off){
  return pts.map((p, i) => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1; return [p[0] - dy / l * off, p[1] + dx / l * off]; });
}
(function drawSwoosh(){
  const sv = $('#swoosh'), paths = [];
  [[[-70, 210], [60, 150], [200, 118], [320, 150], [372, 240], [330, 305], [258, 292], [246, 228], [312, 196], [402, 226], [480, 300]],
   [[-80, 690], [40, 610], [150, 600], [228, 660], [250, 760], [230, 880]]].forEach(pts => {
    RAINBOW.forEach((col, k) => paths.push(el('path', { d: smooth(offsetPts(pts, (k - 3.5) * 7.2)), fill: 'none', stroke: col, 'stroke-width': 5.4, 'stroke-linecap': 'butt', 'stroke-linejoin': 'round' }, sv)));
  });
  if (MODE !== 'render') gsap.fromTo(paths, { drawSVG: '0%' }, { drawSVG: '100%', duration: 2.4, stagger: 0.05, ease: EASE, delay: 0.2 });
})();

/* ---------- Start ---------- */
Sound.init();
const openBtn = $('#openBtn');
openBtn.addEventListener('click', async () => {
  if (openBtn.disabled) return;
  openBtn.disabled = true;
  Sound.unlock();
  openBtn.setAttribute('aria-busy', 'true');
  Sound.startIntro();
  primeVideo();
  gsap.to('#intro', { autoAlpha: 0, duration: 0.9, ease: EASE });
  playBouquet().delay(0.5);
});

if (MODE === 'still'){                         // sluttbildet = vekst-timelinen på siste frame
  enterGrowthState(); buildGrowth(OUTRO_FALLBACK); G.t = OUTRO_FALLBACK; G.tl.time(OUTRO_FALLBACK); vineDrive(); renderGrowth(0);
} else if (MODE === 'render'){                 // render.js: én frame om gangen, deterministisk, uten korn
  enterGrowthState(); buildGrowth(OUTRO_FALLBACK);
  ['#wear', '#grain', '#hint', '#replayBtn', '#intro'].forEach(s => { $(s).style.display = 'none'; });
  svg.setAttribute('viewBox', '-60 -70 520 940'); sizeFx();
  gsap.ticker.sleep();
  resetFx(); G.lastZ = cam.z;
  window.__frame = t => {
    const dt = 1 / VIDEO_FPS;
    wavePhase += dt * 2; drawWater(false);
    G.t = t; G.fxTime = t; G.tl.time(t); renderGrowth(t === 0 ? 0 : dt);
    return new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  };
  window.__dur = OUTRO_FALLBACK;
} else if (MODE === 'grow'){                   // ?scene=grow&t=24 starter veksten ved 24 s
  enterGrowthState(); startSway();
  const t0 = parseFloat(params.get('t')) || 0;
  startGrowth({ start: performance.now() / 1000 - t0 / speed, dur: OUTRO_FALLBACK, clock: 'perf' });
} else if (MODE){ gsap.set('#intro', { autoAlpha: 0 }); playBouquet(); }
})();
</script>
</body>
